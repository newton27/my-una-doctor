name: Validate My UNA Doctor 0.6.7 candidate
on:
  push:
    branches: [fix/una15-compatibility-067]
    paths:
      - '.github/workflows/release-0.6.6.yml'
      - 'scripts/build-release.py'
      - 'tests/updater-contract.php'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: regression-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pregression-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMySQL==1.1.2 cryptography
      - name: Validate PHP, existing behavior, SQL, retry safety and package contracts
        env:
          DOCTOR_TEST_MYSQL: '1'
          MYSQL_PASSWORD: regression-only
        run: DOCTOR_PHP_BIN="$(command -v php)" bash scripts/validate-candidate.sh
  package:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify language XML and release metadata
        run: |
          php -r 'if (simplexml_load_file("install/langs/en.xml") === false) exit(1);'
          grep -F 'Version: **0.6.7**' README.md
          grep -A1 -F 'Current package version:' MARKETPLACE.txt | grep -Fx '0.6.7'
          ! grep -iE '0\.6\.4 CANDIDATE|validation pending' INSTALLATION.txt
      - name: Build and verify full package and six direct updaters
        run: |
          python3 scripts/build-release.py --output dist
          (cd dist && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'doctor-update-fixtures'
          root.mkdir()
          for archive in pathlib.Path('dist').glob('*-to-0.6.7.zip'):
              with zipfile.ZipFile(archive) as package:
                  package.extractall(root)
          PY
      - name: Exercise official UNA updater class against each archive
        env:
          DOCTOR_UNA_UPDATER: ${{ runner.temp }}/BxDolStudioUpdater.php
          DOCTOR_UPDATE_FIXTURES: ${{ runner.temp }}/doctor-update-fixtures
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/unacms/UNA/8f45e86cf7bcdffb9096aba05c12c2f14a71c209/studio/classes/BxDolStudioUpdater.php \
            -o "$DOCTOR_UNA_UPDATER"
          php tests/updater-contract.php
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/unacms/UNA/8f45e86cf7bcdffb9096aba05c12c2f14a71c209/studio/classes/BxDolStudioInstaller.php -o "$RUNNER_TEMP/BxDolStudioInstaller.php"
          DOCTOR_UNA_INSTALLER="$RUNNER_TEMP/BxDolStudioInstaller.php" php tests/compatibility-contract.php install/config.php "$RUNNER_TEMP"/doctor-update-fixtures/*/install/config.php "$RUNNER_TEMP"/doctor-update-fixtures/*/source/install/config.php
      - name: Record exact build checkpoint
        run: |
          cp docs/RELEASE-0.6.7.md dist/RELEASE-NOTES.md
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> dist/RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: my-una-doctor-0.6.7-verified
          path: dist/
          if-no-files-found: error

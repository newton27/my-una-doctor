name: Installation SQL compatibility
on:
  push:
    branches: ['fix/una15-install-sql']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: regression-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pregression-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMySQL==1.1.2 cryptography
      - name: Execute UNA-parsed installation SQL and every interruption retry
        env:
          DOCTOR_TEST_MYSQL: '1'
          MYSQL_PASSWORD: regression-only
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: PHP lint and existing regression suite
        run: |
          find classes install tests upgrade-templates -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/log-classification.php
          php tests/module-version-provenance.php
          php tests/module-version-provenance.php --missing-core-version
          php tests/maintenance-lease.php
          php tests/maintenance-lease-database.php
          php tests/maintenance-cron.php
          php tests/scan-maintenance.php
          php tests/scan-maintenance-diagnostics.php
